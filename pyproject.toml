[project]
name = "youtube-demo-graph-engineering-codex"
version = "0.1.0"
description = "Neutral ticket API for a reproducible prompt-versus-task-graph experiment"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "ruff==0.12.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
